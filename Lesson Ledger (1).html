<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Lesson Ledger · Tutoring made simple</title>
<style>
:root{--bg:#f4f7f6;--surface:#fff;--surface-2:#eef5f2;--text:#17313b;--muted:#6b7d84;--line:#dbe7e3;--brand:#0f766e;--brand-dark:#095b55;--accent:#f59e0b;--danger:#c2413a;--danger-bg:#fff0ee;--radius:18px;--shadow:0 12px 30px rgba(23,49,59,.08)}
:root[data-theme=dark]{--bg:#10191c;--surface:#182529;--surface-2:#203336;--text:#edf8f5;--muted:#a8bbb9;--line:#2d4447;--brand:#54c6b5;--brand-dark:#82ddcf;--accent:#f4bd55;--danger:#ff9287;--danger-bg:#382321;--shadow:0 12px 30px rgba(0,0,0,.24)}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}::selection{background:var(--brand);color:#fff}
.app-shell{display:flex;min-height:100vh}.sidebar{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:8px}.brand{padding:8px 14px 24px;margin-bottom:8px;border-bottom:1px solid var(--line)}.brand-mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;font-size:1.25rem;margin-bottom:10px}.brand h1{font-size:1.25rem;margin:0;letter-spacing:-.03em}.brand h1 span{color:var(--brand)}.brand p{margin:6px 0 0;color:var(--muted);font-size:.8rem}.nav-btn{border:0;background:transparent;color:var(--muted);padding:12px 14px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:11px;font-weight:600;transition:.18s}.nav-btn:hover{background:var(--surface-2);color:var(--text)}.nav-btn.active{background:var(--surface-2);color:var(--brand);box-shadow:inset 3px 0 var(--brand)}.nav-icon{width:22px;text-align:center}.badge{margin-left:auto;border-radius:20px;background:var(--accent);color:#332000;padding:2px 8px;font-size:.72rem}.sidebar-footer{margin-top:auto;display:grid;gap:8px}.main{width:min(1180px,100%);padding:34px clamp(18px,4vw,52px) 70px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px}.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.13em;color:var(--brand);font-weight:800}.page-title{font-size:clamp(1.7rem,3vw,2.35rem);letter-spacing:-.05em;margin:6px 0 5px}.subtitle{color:var(--muted);margin:0;line-height:1.5}.top-actions{display:flex;gap:8px;align-items:center}.icon-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:1.05rem}.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:11px;padding:10px 15px;font-weight:750;transition:.18s;box-shadow:0 4px 10px rgba(15,118,110,.14)}.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark);transform:translateY(-1px)}.btn.secondary{background:transparent;color:var(--brand);box-shadow:none}.btn.quiet{background:transparent;color:var(--muted);border-color:var(--line);box-shadow:none}.btn.danger{color:var(--danger);background:transparent;border-color:transparent;box-shadow:none}.btn.small{padding:7px 10px;font-size:.78rem}.btn:focus-visible,.nav-btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:var(--surface-2);right:-22px;top:-22px}.stat .value{font-size:1.75rem;font-weight:850;letter-spacing:-.05em;position:relative;z-index:1}.stat .label{font-size:.78rem;color:var(--muted);margin-top:5px;position:relative;z-index:1}.content-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:20px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.card h2{font-size:1.05rem;margin:0;letter-spacing:-.02em}.section-head{margin:0 0 18px}.lesson-row,.request-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.lesson-row:last-child,.request-row:last-child{border-bottom:0;padding-bottom:0}.lesson-title{font-weight:750}.meta{font-size:.8rem;color:var(--muted);margin-top:4px}.status{display:inline-flex;align-items:center;border-radius:30px;padding:5px 9px;font-size:.7rem;font-weight:800;text-transform:capitalize;white-space:nowrap}.status.upcoming,.status.paid{background:var(--surface-2);color:var(--brand)}.status.completed{background:#e9e6dd;color:#746d60}.status.cancelled,.status.owing{background:var(--danger-bg);color:var(--danger)}.empty{padding:24px 4px;color:var(--muted);font-size:.9rem;text-align:center}.quick-actions{display:grid;gap:10px}.quick-actions .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
.form-card{max-width:780px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field.full{grid-column:1/-1}.field label{display:block;color:var(--muted);font-size:.76rem;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text)}.field textarea{min-height:82px;resize:vertical}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;margin-top:4px}.notice{padding:13px 15px;border-radius:12px;background:var(--surface-2);color:var(--brand);font-size:.86rem;line-height:1.45}.hero-card{background:linear-gradient(135deg,var(--brand),#155e75);color:#fff;border:0}.hero-card .eyebrow,.hero-card .subtitle{color:rgba(255,255,255,.78)}.hero-card h2{font-size:1.45rem;letter-spacing:-.04em;margin:6px 0}.share-box{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:10px;border-radius:10px;word-break:break-all;font-size:.75rem;margin-top:15px}
body.solo .sidebar{display:none}body.solo .main{max-width:760px;margin:auto;padding-top:7vh}.welcome{max-width:560px;margin:auto}.welcome .card{padding:clamp(25px,6vw,48px);text-align:center}.welcome-logo{font-size:2.5rem}.welcome h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.07em;margin:8px 0}.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:12px;transition:.18s}.choice:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}.choice-icon{font-size:1.45rem}.choice strong{display:block;color:var(--brand)}.choice small{display:block;color:var(--muted);margin-top:3px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--surface);padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:.86rem;z-index:5;animation:slide .2s ease-out}@keyframes slide{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}}@media(max-width:680px){.app-shell{display:block}.sidebar{width:100%;height:auto;padding:10px;display:block;position:sticky;top:0;z-index:4;overflow:auto;white-space:nowrap}.brand,.sidebar-footer{display:none}.nav-btn{display:inline-flex;padding:10px 12px}.nav-btn.active{box-shadow:inset 0 -3px var(--brand)}.main{padding:24px 15px 55px}.topbar{align-items:center}.top-actions .btn{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.form-actions{grid-column:auto}.lesson-row,.request-row{align-items:flex-start;flex-direction:column}.lesson-row>div:last-child,.request-row>div:last-child{width:100%;display:flex;justify-content:flex-end;flex-wrap:wrap}.stats{gap:10px}.stat{padding:14px}.stat .value{font-size:1.35rem}.card{padding:16px}}
</style>
</head>
<body>
<div class="app-shell">
<nav class="sidebar" aria-label="Main navigation">
  <div class="brand"><div class="brand-mark">✦</div><h1>Lesson<span> Ledger</span></h1><p>Your tutoring, beautifully organised.</p></div>
  <button class="nav-btn active" data-view="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
  <button class="nav-btn" data-view="requests"><span class="nav-icon">✉</span>Requests <span id="reqBadge" class="badge" hidden></span></button>
  <button class="nav-btn" data-view="students"><span class="nav-icon">♙</span>Students</button>
  <button class="nav-btn" data-view="lessons"><span class="nav-icon">▣</span>Lessons</button>
  <button class="nav-btn" data-view="payments"><span class="nav-icon">R</span>Payments</button>
  <div class="sidebar-footer"><button class="btn secondary small" id="shareBtn">🔗 Share booking link</button><button class="btn quiet small" id="themeBtn">☼ Toggle appearance</button><button class="btn quiet small" id="pinBtn">🔒 Change PIN</button></div>
</nav>
<main class="main" id="app"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
(()=>{
'use strict';
const DATA_KEY='lessonledger:data',ROLE_KEY='lessonledger:role',PIN_KEY='lessonledger:pin';
const RATE={'One-on-one':200,Group:120}; let data={students:[],lessons:[],requests:[]},role=null,view='dashboard',mode='landing',editingRequest=null,toastTimer;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10), uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2), money=n=>'R '+(Number(n)||0).toFixed(2), name=id=>data.students.find(s=>s.id===id)?.name||'Unknown student';
function load(){try{data=Object.assign({students:[],lessons:[],requests:[]},JSON.parse(localStorage.getItem(DATA_KEY)||'{}'));role=localStorage.getItem(ROLE_KEY)}catch(e){}} function save(){localStorage.setItem(DATA_KEY,JSON.stringify(data))} function setRole(r){role=r;localStorage.setItem(ROLE_KEY,r)}
function notify(message){const t=$('#toast');t.textContent=message;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2200)}
function base(){return location.origin+location.pathname} function encode(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))} function decode(s){return JSON.parse(decodeURIComponent(escape(atob(s))))}
function importRequest(){const m=location.hash.match(/req=([^&]+)/);if(!m)return false;try{const r=decode(decodeURIComponent(m[1]));if(!data.requests.some(x=>x.id===r.id))data.requests.push(r);save();setRole('tutor');history.replaceState(null,'',location.pathname);return true}catch(e){return false}}
function nav(title,sub,action=''){return `<header class="topbar"><div><div class="eyebrow">Lesson Ledger</div><h1 class="page-title">${title}</h1><p class="subtitle">${sub}</p></div>${action?`<div class="top-actions">${action}</div>`:''}</header>`}
function lessonRow(l,actions=''){return `<div class="lesson-row"><div><div class="lesson-title">${esc(name(l.studentId))} <span style="color:var(--muted)">·</span> ${esc(l.subject||'Lesson')}</div><div class="meta">${esc(l.date)} · ${esc(l.time||'Time TBC')} · ${esc(l.duration||60)} min · ${esc(l.type||'One-on-one')}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="status ${l.status}">${l.status}</span>${actions}</div></div>`}
function dashboard(){const upcoming=data.lessons.filter(l=>l.status==='upcoming').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),todays=upcoming.filter(l=>l.date===today()),owed=data.lessons.filter(l=>l.status==='completed'&&!l.paid).reduce((a,l)=>a+Number(l.rate||0),0);let h=nav(new Date().getHours()<12?'Good morning, Elias':new Date().getHours()<18?'Good afternoon, Elias':'Good evening, Elias','Here is your tutoring snapshot.');h+=`<div class="stats"><div class="stat"><div class="value">${data.students.length}</div><div class="label">Active students</div></div><div class="stat"><div class="value">${todays.length}</div><div class="label">Lessons today</div></div><div class="stat"><div class="value">${upcoming.length}</div><div class="label">Upcoming lessons</div></div><div class="stat"><div class="value">${money(owed)}</div><div class="label">Outstanding balance</div></div></div>`;h+='<div class="content-grid"><section class="card"><div class="card-head"><h2>Today\'s lessons</h2><button class="btn secondary small" data-go="lessons">View all</button></div>';h+=todays.length?todays.map(l=>lessonRow(l)).join(''):'<div class="empty">Your day is clear. Enjoy the breathing room!</div>';h+='</section><aside><section class="card hero-card"><div class="eyebrow">Keep things moving</div><h2>Ready for your next booking?</h2><p class="subtitle">Share your personal booking link and let students request a session in minutes.</p><button class="btn" id="heroShare" style="margin-top:14px;background:#fff;color:#0f766e;border-color:#fff">Copy booking link</button></section><section class="card"><div class="card-head"><h2>Quick actions</h2></div><div class="quick-actions"><button class="btn secondary" data-go="students">＋ Add a student <span>→</span></button><button class="btn secondary" data-go="lessons">＋ Book a lesson <span>→</span></button><button class="btn secondary" data-go="requests">✉ Review requests <span>→</span></button></div></section></aside></div>`;return h}
function landing(){if(mode==='pin')return `<div class="welcome"><section class="card"><div class="welcome-logo">🔐</div><h1>Welcome back</h1><p class="subtitle">Enter your tutor PIN to open your dashboard.</p><form id="loginForm" class="form-grid" style="margin-top:24px"><div class="field full"><label for="pin">Tutor PIN</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required autofocus></div><div class="form-actions"><button type="button" class="btn quiet" data-landing>Back</button><button class="btn">Unlock dashboard</button></div></form></section></div>`;return `<div class="welcome"><section class="card"><div class="welcome-logo">✦</div><div class="eyebrow">Simple tutoring management</div><h1>Lesson Ledger</h1><p class="subtitle">Keep your students, sessions and payments in one calm, beautiful place.</p><button class="choice" id="chooseStudent"><span class="choice-icon">📚</span><span><strong>I want to book a session</strong><small>Send a request to your tutor.</small></span><span>→</span></button><button class="choice" id="chooseTutor"><span class="choice-icon">🗂️</span><span><strong>I'm the tutor</strong><small>Manage your tutoring business.</small></span><span>→</span></button></section></div>`}
function booking(){if(mode==='sent')return `<div class="welcome"><section class="card"><div class="welcome-logo">✅</div><h1>Request ready!</h1><p class="subtitle">Send the link below to your tutor through WhatsApp or email.</p><div class="share-box" style="color:#fff;background:var(--surface-2)"><span style="color:var(--text)">${esc(mode.link)}</span></div><div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px"><button class="btn" id="whatsapp">Send on WhatsApp</button><button class="btn secondary" id="copyRequest">Copy link</button></div><button class="btn quiet" id="another" style="margin-top:18px">Book another session</button></section></div>`;return `<div class="welcome"><section class="card" style="text-align:left"><div class="eyebrow">Booking request</div><h1 style="font-size:2rem">Find time to learn.</h1><p class="subtitle">Tell your tutor a little about what you need. They will confirm the time and price.</p><form id="bookingForm" class="form-grid" style="margin-top:24px"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Subject / course</label><input name="subject" required></div><div class="field"><label>WhatsApp or email</label><input name="contact" required></div><div class="field"><label>Institution <span style="font-weight:400">(optional)</span></label><input name="institution"></div><div class="field"><label>Preferred date</label><input name="date" type="date" min="${today()}"></div><div class="field"><label>Preferred time</label><input name="time" type="time"></div><div class="field full"><label>What would you like help with?</label><textarea name="message" placeholder="Topics, group size or anything else..."></textarea></div><div class="form-actions"><button class="btn">Create booking request →</button></div></form></section></div>`}
function requests(){let h=nav('Booking requests','Review new enquiries and turn them into scheduled lessons.');const p=data.requests.filter(r=>r.status==='pending');h+='<section class="card">';if(!p.length)h+='<div class="empty">No pending requests yet.<br>Share your booking link whenever you are ready.</div>';p.forEach(r=>{if(editingRequest===r.id){h+=`<form id="confirmForm" data-id="${r.id}" class="form-grid"><div class="field full"><label>Student</label><input value="${esc(r.name)} · ${esc(r.subject)}" disabled></div><div class="field"><label>Date</label><input name="date" type="date" value="${r.date||today()}" required></div><div class="field"><label>Time</label><input name="time" type="time" value="${r.time||''}" required></div><div class="field"><label>Duration</label><input name="duration" type="number" value="60" min="15" step="15"></div><div class="field"><label>Session type</label><select name="type"><option>One-on-one</option><option>Group</option></select></div><div class="field"><label>Price (R)</label><input name="rate" type="number" min="0" step=".01" value="${RATE['One-on-one']}"></div><div class="form-actions"><button type="button" class="btn quiet" data-cancel-confirm>Cancel</button><button class="btn">Confirm & schedule</button></div></form>`}else h+=`<div class="request-row"><div><div class="lesson-title">${esc(r.name)} · ${esc(r.subject)}</div><div class="meta">${esc(r.contact)}${r.institution?' · '+esc(r.institution):''}${r.date?' · prefers '+esc(r.date)+' '+esc(r.time||''):''}</div>${r.message?`<div class="meta">“${esc(r.message)}”</div>`:''}</div><div><button class="btn small" data-confirm="${r.id}">Set price & confirm</button><button class="btn small danger" data-decline="${r.id}">Decline</button></div></div>`});return h+'</section>'}
function students(){let h=nav('Students','Your active learner list and their default session rates.','<button class="btn" data-toggle-student>＋ Add student</button>');if(mode==='studentForm')h+=formStudent();h+='<section class="card">';if(!data.students.length)h+='<div class="empty">No students yet. Add your first learner to get started.</div>';data.students.forEach(s=>{const owed=data.lessons.filter(l=>l.studentId===s.id&&l.status==='completed'&&!l.paid).reduce((a,l)=>a+Number(l.rate||0),0);h+=`<div class="lesson-row"><div><div class="lesson-title">${esc(s.name)}${s.subject?' · '+esc(s.subject):''}</div><div class="meta">${esc(s.institution||'')}${s.contact?' · '+esc(s.contact):''}${s.rate?' · '+money(s.rate)+'/session':''}</div></div><div>${owed?`<span class="status owing">${money(owed)} owed</span>`:''}<button class="btn small danger" data-delete-student="${s.id}">Remove</button></div></div>`});return h+'</section>'}
function formStudent(){return `<section class="card form-card"><div class="card-head"><h2>Add a student</h2><button class="btn quiet small" data-toggle-student>Close</button></div><form id="studentForm" class="form-grid"><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Subject / course</label><input name="subject"></div><div class="field"><label>Institution</label><input name="institution"></div><div class="field"><label>Contact</label><input name="contact"></div><div class="field"><label>Class type</label><select name="classType"><option>One-on-one</option><option>Group</option></select></div><div class="field"><label>Default rate (R)</label><input name="rate" type="number" value="200" min="0"></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div><div class="form-actions"><button class="btn">Save student</button></div></form></section>`}
function lessons(){let h=nav('Lessons','Plan upcoming sessions and keep your history tidy.','<button class="btn" data-toggle-lesson>＋ Book lesson</button>');if(mode==='lessonForm')h+=formLesson();h+='<section class="card">';if(!data.lessons.length)h+='<div class="empty">No lessons booked yet.</div>';[...data.lessons].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).forEach(l=>h+=lessonRow(l,l.status==='upcoming'?`<button class="btn small" data-complete="${l.id}">Done</button><button class="btn small quiet" data-cancel="${l.id}">Cancel</button>`:`<button class="btn small danger" data-delete-lesson="${l.id}">Delete</button>`));return h+'</section>'}
function formLesson(){const opts=data.students.map(s=>`<option value="${s.id}" data-rate="${s.rate||RATE[s.classType]||200}" data-type="${s.classType||'One-on-one'}">${esc(s.name)}</option>`).join('');return `<section class="card form-card"><div class="card-head"><h2>Book a lesson</h2><button class="btn quiet small" data-toggle-lesson>Close</button></div><form id="lessonForm" class="form-grid"><div class="field"><label>Student</label><select name="studentId" id="lessonStudent">${opts}</select></div><div class="field"><label>Subject / topic</label><input name="subject"></div><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Time</label><input name="time" type="time" required></div><div class="field"><label>Duration (minutes)</label><input name="duration" type="number" value="60" min="15" step="15"></div><div class="field"><label>Type</label><select name="type" id="lessonType"><option>One-on-one</option><option>Group</option></select></div><div class="field"><label>Rate charged (R)</label><input name="rate" id="lessonRate" type="number" value="${data.students[0]?.rate||200}" min="0"></div><div class="field full"><label>Notes</label><textarea name="notes"></textarea></div><div class="form-actions"><button class="btn">Save lesson</button></div></form></section>`}
function payments(){const c=data.lessons.filter(l=>l.status==='completed'),total=c.reduce((a,l)=>a+Number(l.rate||0),0),owed=c.filter(l=>!l.paid).reduce((a,l)=>a+Number(l.rate||0),0);let h=nav('Payments','A clear view of what has been billed and received.');h+=`<div class="stats"><div class="stat"><div class="value">${money(total)}</div><div class="label">Total billed</div></div><div class="stat"><div class="value">${money(total-owed)}</div><div class="label">Received</div></div><div class="stat"><div class="value">${money(owed)}</div><div class="label">Outstanding</div></div><div class="stat"><div class="value">${c.length}</div><div class="label">Completed lessons</div></div></div><section class="card">`;if(!c.length)h+='<div class="empty">Completed lessons will appear here when you mark them done.</div>';c.forEach(l=>h+=lessonRow(l,`<span class="status ${l.paid?'paid':'owing'}">${l.paid?'Paid':'Owing'}</span><button class="btn small ${l.paid?'quiet':''}" data-paid="${l.id}">${l.paid?'Mark unpaid':'Mark paid'}</button>`));return h+'</section>'}
function changePin(){return `${nav('Change PIN','Keep your tutor dashboard private.')}<section class="card form-card"><form id="pinForm" class="form-grid"><div class="field full"><label>Current PIN</label><input name="current" type="password" required></div><div class="field"><label>New PIN</label><input name="next" type="password" minlength="4" required></div><div class="field"><label>Confirm new PIN</label><input name="confirm" type="password" minlength="4" required></div><div class="form-actions"><button type="button" class="btn quiet" data-close-pin>Back</button><button class="btn">Save PIN</button></div></form></section>`}
function render(){document.body.classList.toggle('solo',role!=='tutor');const app=$('#app');if(role!=='tutor')app.innerHTML=role==='student'?booking():landing();else app.innerHTML=mode==='pinChange'?changePin():view==='dashboard'?dashboard():view==='requests'?requests():view==='students'?students():view==='lessons'?lessons():payments();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const n=data.requests.filter(r=>r.status==='pending').length;$('#reqBadge').hidden=!n;$('#reqBadge').textContent=n;bind()}
function copy(text){navigator.clipboard?.writeText(text).then(()=>notify('Link copied to clipboard')).catch(()=>prompt('Copy this link:',text))}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;mode='';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;mode='';render()});$('#chooseStudent')?.addEventListener('click',()=>{setRole('student');render()});$('#chooseTutor')?.addEventListener('click',()=>{mode='pin';render()});document.querySelector('[data-landing]')?.addEventListener('click',()=>{mode='landing';render()});$('#loginForm')?.addEventListener('submit',e=>{e.preventDefault();if(new FormData(e.target).get('pin')===(localStorage.getItem(PIN_KEY)||'871101')){setRole('tutor');mode='';view='dashboard';render()}else notify('Incorrect PIN')});$('#shareBtn')?.addEventListener('click',()=>copy(base()+'#book'));$('#heroShare')?.addEventListener('click',()=>copy(base()+'#book'));$('#themeBtn')?.addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('lessonledger:theme',dark?'light':'dark')});$('#pinBtn')?.addEventListener('click',()=>{mode='pinChange';render()});document.querySelector('[data-close-pin]')?.addEventListener('click',()=>{mode='';render()});$('#pinForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),current=f.get('current'),next=f.get('next');if(current!==(localStorage.getItem(PIN_KEY)||'871101'))return notify('Current PIN is incorrect');if(next!==f.get('confirm'))return notify('PINs do not match');localStorage.setItem(PIN_KEY,next);notify('PIN updated');mode='';setTimeout(render,500)});document.querySelector('[data-toggle-student]')?.addEventListener('click',()=>{mode=mode==='studentForm'?'':'studentForm';render()});document.querySelector('[data-toggle-lesson]')?.addEventListener('click',()=>{mode=mode==='lessonForm'?'':'lessonForm';render()});$('#bookingForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),r={id:uid(),name:f.get('name').trim(),subject:f.get('subject').trim(),contact:f.get('contact').trim(),institution:f.get('institution').trim(),date:f.get('date'),time:f.get('time'),message:f.get('message').trim(),status:'pending',createdAt:Date.now()};mode='sent';mode.link=base()+'#req='+encodeURIComponent(encode(r));render()});$('#copyRequest')?.addEventListener('click',()=>copy(mode.link));$('#whatsapp')?.addEventListener('click',()=>open('https://wa.me/?text='+encodeURIComponent('Hi! Please confirm my tutoring request: '+mode.link),'_blank'));$('#another')?.addEventListener('click',()=>{mode='';render()});$('#studentForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);data.students.push({id:uid(),name:f.get('name').trim(),subject:f.get('subject').trim(),institution:f.get('institution').trim(),contact:f.get('contact').trim(),rate:f.get('rate')||0,classType:f.get('classType'),notes:f.get('notes').trim()});save();mode='';notify('Student added');render()});$('#lessonForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);data.lessons.push({id:uid(),studentId:f.get('studentId'),subject:f.get('subject').trim(),date:f.get('date'),time:f.get('time'),duration:f.get('duration')||60,type:f.get('type'),rate:f.get('rate')||0,notes:f.get('notes').trim(),status:'upcoming',paid:false});save();mode='';notify('Lesson booked');render()});document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{editingRequest=b.dataset.confirm;render()});document.querySelector('[data-cancel-confirm]')?.addEventListener('click',()=>{editingRequest=null;render()});$('#confirmForm')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),r=data.requests.find(x=>x.id===e.target.dataset.id);let s=data.students.find(x=>x.contact?.toLowerCase()===r.contact.toLowerCase());if(!s){s={id:uid(),name:r.name,subject:r.subject,institution:r.institution,contact:r.contact,rate:f.get('rate'),classType:f.get('type'),notes:''};data.students.push(s)}data.lessons.push({id:uid(),studentId:s.id,subject:r.subject,date:f.get('date'),time:f.get('time'),duration:f.get('duration'),type:f.get('type'),rate:f.get('rate'),notes:r.message,status:'upcoming',paid:false});data.requests=data.requests.filter(x=>x.id!==r.id);editingRequest=null;save();notify('Request confirmed');view='lessons';render()});document.querySelectorAll('[data-decline]').forEach(b=>b.onclick=()=>{data.requests=data.requests.filter(r=>r.id!==b.dataset.decline);save();notify('Request declined');render()});document.querySelectorAll('[data-delete-student]').forEach(b=>b.onclick=()=>{if(confirm('Remove this student and lesson history?')){data.students=data.students.filter(s=>s.id!==b.dataset.deleteStudent);data.lessons=data.lessons.filter(l=>l.studentId!==b.dataset.deleteStudent);save();render()}});document.querySelectorAll('[data-delete-lesson]').forEach(b=>b.onclick=()=>{data.lessons=data.lessons.filter(l=>l.id!==b.dataset.deleteLesson);save();render()});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const l=data.lessons.find(x=>x.id===b.dataset.complete);l.status='completed';save();render()});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{const l=data.lessons.find(x=>x.id===b.dataset.cancel);l.status='cancelled';save();render()});document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>{const l=data.lessons.find(x=>x.id===b.dataset.paid);l.paid=!l.paid;save();render()})}
load();document.documentElement.dataset.theme=localStorage.getItem('lessonledger:theme')||'light';if(importRequest()){view='requests'}else if(location.hash.includes('book')&&role!=='tutor')setRole('student');else if(!role)view='dashboard';render();
})();
</script>
</body>
</html>
